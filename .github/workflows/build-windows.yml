name: Build Windows exe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[build]"

      - name: Build
        run: python -m PyInstaller --noconfirm --clean packaging/NordScribe.spec

      - name: Show artefact
        run: Get-Item dist/NordScribe.exe | Format-List Name,Length,LastWriteTime

      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: NordScribe-windows
          path: dist/NordScribe.exe
          if-no-files-found: error
