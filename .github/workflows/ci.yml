name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Whisper не читает сжатые форматы без ffmpeg, а sounddevice нужен
      # приложению и проверкам окружения — без системной библиотеки
      # PortAudio импорт модуля падает ещё до тестов.
      - name: Системные зависимости
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libportaudio2 libsndfile1

      # Тяжёлые зависимости (torch тянет openai-whisper) нужны, потому что
      # download_manager и whisper_worker импортируют whisper на уровне модуля.
      - name: Зависимости проекта и инструменты разработки
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ".[dev]"

      - name: Линтер
        run: python -m ruff check .

      # Форматирование пока не блокирует сборку: правила ruff-format не
      # проверялись локально, а ронять из-за пробелов CI не хочется.
      # После первого прогона `ruff format .` шаг можно сделать строгим.
      - name: Форматирование (необязательно)
        continue-on-error: true
        run: python -m ruff format --check .

      - name: Типы
        run: python -m mypy .

      - name: Тесты
        run: python -m pytest -q
